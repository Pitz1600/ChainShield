services:
  # =========================
  # MongoDB Database
  # =========================
  mongodb:
    image: mongo:7.0
    container_name: chainshield-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: chainshield
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - chainshield-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================
  # Backend API (Node.js)
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chainshield-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      AKISMET_ENABLED: ${AKISMET_ENABLED}
      AKISMET_API_KEY: ${AKISMET_API_KEY}
      AKISMET_BLOG: ${AKISMET_BLOG}
      FRONTEND_URL: ${FRONTEND_URL}
      ML_SERVICE_URL: ${ML_SERVICE_URL}
      GRAPH_SERVICE_URL: ${GRAPH_SERVICE_URL}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      BLOCKCHAIN_ACCOUNT: ${BLOCKCHAIN_ACCOUNT}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY}
      REDIS_URL: redis://redis:6379
      ML_API_SECRET: ${ML_API_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
      graph-service:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - chainshield-network
    command: sh -c "[ -d node_modules ] || npm install; npm run dev"

  # =========================
  # Redis (Rate Limiter Persistence)
  # =========================
  redis:
    image: redis:7-alpine
    container_name: chainshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - chainshield-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # ML Service (Python)
  # =========================
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: chainshield-ml-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      ML_API_SECRET: ${ML_API_SECRET:-chainshield_ml_internal_secret_dev}
    volumes:
      - ./ml_service:/app
      - ml_models:/app/models
      - ml_datasets:/app/datasets
    networks:
      - chainshield-network
    command: python app.py

  # =========================
  # Graph Service (Python)
  # =========================
  graph-service:
    build:
      context: ./graph_service
      dockerfile: Dockerfile
    container_name: chainshield-graph-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - ./graph_service:/app
    networks:
      - chainshield-network
    command: python app.py

  # =========================
  # Frontend (React + Vite)
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chainshield-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - chainshield-network
    command: sh -c "[ -d node_modules ] || npm install; npm run dev -- --host 0.0.0.0 --port 5173"

  # =========================
  # Ganache Blockchain (Local Ethereum)
  # =========================
  ganache:
    image: trufflesuite/ganache:latest
    container_name: chainshield-ganache
    restart: unless-stopped
    ports:
      - "7546:8545"
    command: >
      --mnemonic "${GANACHE_MNEMONIC}" --networkId ${GANACHE_NETWORK_ID:-1337} --accounts 10 --defaultBalanceEther 1000 --gasLimit 10000000 --gasPrice 20000000000 --database.dbPath /ganache_data
    volumes:
      - ganache_data:/ganache_data
    networks:
      - chainshield-network

# =========================
# Networks
# =========================
networks:
  chainshield-network:
    driver: bridge

# =========================
# Volumes
# =========================
volumes:
  mongodb_data:
  ml_models:
  ml_datasets:
  ganache_data:
  redis_data:
  frontend_node_modules:
  backend_node_modules:
